name: Build and Release

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      shell: bash
      run: |
        # Get path to customtkinter for the --add-data flag
        CTK_PATH=$(python -c "import customtkinter; import os; print(os.path.dirname(customtkinter.__file__))")
        
        if [ "${{ matrix.os }}" == "windows-latest" ]; then
          pyinstaller --onefile --windowed --name FocusApp --add-data "$CTK_PATH;customtkinter" main.py
        else
          pyinstaller --onefile --windowed --name FocusApp --add-data "$CTK_PATH:customtkinter" main.py
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FocusApp-${{ matrix.os }}
        path: dist/FocusApp*
