name: FocusApp Production Build

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: 📦 Install System Dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk

    - name: 📦 Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: 🏗️ Build Standalone Executable
      shell: bash
      run: |
        # Build using the portable .spec file
        pyinstaller FocusApp.spec

    - name: 🧹 Cleanup & Rename (Windows)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        mv dist/FocusApp.exe dist/FocusApp-Windows.exe

    - name: 🧹 Cleanup & Rename (Linux)
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        mv dist/FocusApp dist/FocusApp-Linux

    - name: 📤 Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FocusApp-${{ matrix.os }}
        path: |
          dist/FocusApp-Windows.exe
          dist/FocusApp-Linux

  release:
    name: 🚀 Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: 📦 Create Release
        uses: softprops/action-gh-release@v2
        with:
            files: |
              release-artifacts/FocusApp-Windows.exe
              release-artifacts/FocusApp-Linux
            name: Release ${{ github.ref_name }}
            tag_name: ${{ github.ref }}
            draft: false
            prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
